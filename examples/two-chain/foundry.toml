[profile.default]
src = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
bytecode_hash = "none"
auto_detect_remappings = false
remappings = ["forge-std/=lib/forge-std/src/", "sprue/=lib/sprue/src/"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
  { access = "read", path = "./broadcast" },
  { access = "read", path = "./script/deploy/units" },
  { access = "read", path = "./sprue.json" },
]

[rpc_endpoints]
source = "http://127.0.0.1:8545"
receiver = "http://127.0.0.1:8546"
