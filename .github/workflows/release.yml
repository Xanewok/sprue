name: release

# Stages the release on npm through trusted publishing: npm trusts this file's OIDC token, so no
# npm token is stored, and the trusted publisher stays stage-only. A version goes live only when a
# maintainer approves it with 2FA on npmjs.com or with `npm stage approve`, which no OIDC token can.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `npm stage` needs npm 11.15.0 and Node 22.14.0 or later; this Node bundles npm 11.19.0.
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Refuse anything but a released commit of main
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "run this on a tag, not $GITHUB_REF" >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME is not package.json's v$version" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - run: npm stage publish
